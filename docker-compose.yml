services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: productos
      POSTGRES_USER: productos
      POSTGRES_PASSWORD: productos
    ports:
      - "5432:5432"
    volumes:
      - productos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productos -d productos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  productos_postgres:
