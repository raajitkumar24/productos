name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Lint backend
        run: ruff check src tests
      - name: Test backend
        run: pytest
      - name: Build API container
        run: docker build -f deploy/docker/api.Dockerfile -t productos-api:ci .
      - name: Smoke test API container
        run: |
          docker run --detach --name productos-api-ci --publish 8000:8000 productos-api:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs productos-api-ci
          exit 1
      - name: Stop API container
        if: always()
        run: docker rm --force productos-api-ci || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build
